version: '3.8'

services:

  db:
    image: postgres:13
    container_name: postgres-db
    environment:
      - POSTGRES_USER={USER}
      - POSTGRES_PASSWORD={PASS}
      - POSTGRES_DB={DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: ./app
    container_name: backend
    environment:
      - DATABASE_URL=postgresql://{USER}:{PASS}@{HOST}:5432/{DB_NAME}
      - "8000:8000"
    depends_on:
      - db

  bot:
    build:
      context: ./bot
    container_name: telegram-bot
    depends_on:
      - db
      - backend
    restart: always

volumes:
  postgres-data:
    driver: local
